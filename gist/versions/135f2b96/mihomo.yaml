  route-address:
  - 0.0.0.0/1
  - 128.0.0.0/1
  - ::/1
  - 8000::/1
  route-address-set:
  - google_ip
  route-exclude-address-set:
  - lan
  - private
  - cn_ip
  stack: mips
unified-delay: true
