skip-auth-prefixes:
- 127.0.0.1/8
- ::1/128
sniffer:
  enable: true
  force-domain:
  - +.v2ex.com
  override-destination: false
  port-whitelist:
  - "80"
  - "443"
  sniff:
    HTTP:
      override-destination: true
      ports:
      - 80
      - 8080-8880
    QUIC: null
    TLS: null
socks-port: 7891
tcp-concurrent: true
tun:
  auto-redirect: false
  dns-hijack:
  - 0.0.0.0:53
  enable: false
  route-address:
  - 0.0.0.0/1
  - 128.0.0.0/1
  - ::/1
  - 8000::/1
  route-address-set:
  - google_ip
  route-exclude-address-set:
  - lan
  - private
  - cn_ip
  stack: system
unified-delay: true
